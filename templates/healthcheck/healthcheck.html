{% load static %}
{% load custom_filters %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Check Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{% static 'icons/favicon.ico' %}">
</head>

<body style="background-color: #f4f6f8;">

<!-- ✅ NAVBAR (LIGHT – BEST FOR BLUE LOGO) -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container-fluid">

        <!-- ✅ LOGO (TOP LEFT) -->
        <a class="navbar-brand" href="/healthcheck/">
            <img src="{% static 'images/logo.png' %}"
                 alt="Health Check Logo"
                 height="36"
                 class="d-inline-block align-middle">
        </a>

        <!-- ✅ RIGHT SIDE: WELCOME + LOGOUT -->
        <div class="d-flex align-items-center ms-auto">
            {% if request.user.is_authenticated %}
                <span class="navbar-text me-3 text-dark">
                    Welcome, {{ request.user.email }}
                </span>

                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        Logout
                    </button>
                </form>
            {% endif %}
        </div>

    </div>
</nav>

<!-- ✅ MAIN CONTENT -->
<div class="container mt-5">
    <h1 class="text-center mb-4">Health Check Dashboard</h1>

    <div class="alert alert-info text-center">
        System health status will appear here.
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
